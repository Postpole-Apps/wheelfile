# Copy to .github/workflows/release.yml (the bot cannot push to .github/workflows/).
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON,
# GOOGLE_SERVICES_JSON (contents of app/google-services.json; required for GA4 + Crashlytics).
# Bump versionCode in app/build.gradle.kts before every Play upload (Play rejects duplicates).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_internal_track:
        description: Upload the AAB as a draft to the Play internal track
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: chmod +x gradlew

      - name: Prepare signing keystore (fails if any signing secret is missing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is empty; refusing to build an unsigned release."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write google-services.json (GA4 + Crashlytics)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty; every release must include GA4 + Crashlytics."
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify the AAB is signed
        run: |
          set -euo pipefail
          for f in app/build/outputs/bundle/release/*.aab; do
            jarsigner -verify "$f" | grep -q 'jar verified' || { echo "::error::$f is not signed"; exit 1; }
          done

      - name: Read packageName from build.gradle.kts
        id: pkg
        run: |
          name="$(sed -n 's/^[[:space:]]*applicationId = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Locate native debug symbols (absent when the app has no native code)
        id: syms
        run: |
          f=app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-and-symbols
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn

      - name: Upload to Play internal track (draft)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_internal_track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.pkg.outputs.name }}
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          debugSymbols: ${{ steps.syms.outputs.path }}

      - name: Remove keystore and google-services.json
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" app/google-services.json
